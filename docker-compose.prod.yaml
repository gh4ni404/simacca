name: simacca

services:
  app:
    image: simacca-app:latest
    container_name: simacca_app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./writable/uploads:/var/www/html/writable/uploads
      - ./.env:/var/www/html/.env:ro
    networks:
      - simacca_network

  webserver:
    image: nginx:alpine
    container_name: simacca_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - simacca_network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: simacca_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    volumes:
      - ./cloudflare:/etc/cloudflared:ro
    depends_on:
      - webserver
    networks:
      - simacca_network

networks:
  simacca_network:
    driver: bridge
