name: simacca

services:
  # Database Service (MariaDB 10.11)
  db:
    image: mariadb:10.11
    container_name: simacca_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-simacca_db}
      MYSQL_USER: ${DB_USERNAME:-simacca_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-simacca_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - simacca_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - simacca_network

  # PHP 8.3 FPM Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simacca_app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - simacca_network

  # Nginx Webserver Service
  webserver:
    image: nginx:alpine
    container_name: simacca_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - simacca_network

  # Cloudflare Tunnel Service (Diaktifkan opsional via profile: docker compose --profile tunnel up)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: simacca_tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    volumes:
      - ./cloudflare:/etc/cloudflared:ro
    depends_on:
      - webserver
    networks:
      - simacca_network

volumes:
  simacca_db_data:
    driver: local

networks:
  simacca_network:
    driver: bridge